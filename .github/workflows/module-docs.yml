name: Generate Module READMEs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build NixOS module docs
        run: nix build .#module-docs-nixos -o result-nixos

      - name: Build Home module docs
        run: nix build .#module-docs-home -o result-home

      - name: Copy READMEs
        run: |
          cp result-nixos modules/nixos/README.md
          cp result-home modules/home/README.md

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add modules/nixos/README.md modules/home/README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: regenerate module READMEs"
            git push
          fi
