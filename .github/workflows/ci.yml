name: CI

on:
  push:
  pull_request:
  workflow_run:
    workflows: ["Daily Nix Update"]
    types: [completed]
    branches: [testing]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      # GitHub-native Nix build cache — no Cachix account required.
      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Resolve flake inputs
        run: nix flake update

      # Auto-format via treefmt (nixfmt + deadnix) and commit if anything changed.
      # A local commit is enough for inputs.self to point at formatted source when
      # nix flake check runs. Pushing would move the PR HEAD to a bot commit that
      # GitHub Actions won't re-trigger CI for.
      - name: Auto-format (treefmt)
        run: |
          nix fmt
          if ! git diff --quiet; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -am "style: auto-format"
          fi

      # Runs checks.x86_64-linux.{format,lint} defined in flake.nix.
      # format: nixfmt + deadnix diff    lint: statix
      - name: nix flake check
        run: nix flake check -L

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Tag Claude on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_CYCLES = 5;
            const pr_number = context.payload.pull_request.number;
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });

            const tagged = comments.filter(c =>
              c.user.type === 'Bot' &&
              c.body.includes('<!-- claude-auto-tag -->')
            );

            if (tagged.length >= MAX_CYCLES) {
              core.notice(`Cycle limit of ${MAX_CYCLES} reached for PR #${pr_number}. Skipping.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: `<!-- claude-auto-tag -->\n@claude CI failed on this PR. Please investigate the [failed run](${run_url}), identify the root cause, and push a fix.`,
            });
