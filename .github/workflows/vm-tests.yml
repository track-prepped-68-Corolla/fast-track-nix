name: Framework VM Smoke Tests

on:
  push:
    branches:
      - testing
  pull_request:
    branches:
      - testing
  workflow_dispatch:

jobs:
  vm-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      # GitHub's ubuntu-latest runners expose /dev/kvm but it needs 0666
      # permissions so the Nix build sandbox can access it.
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Resolve flake inputs
        shell: bash
        run: nix flake update 2>&1 | tee /tmp/ci-update.log; exit ${PIPESTATUS[0]}

      - name: Run framework VM smoke tests
        shell: bash
        run: |
          nix build -L --no-link \
            --option system-features "nixos-test kvm benchmark big-parallel" \
            .#vm-bulk-pool-load \
            2>&1 | tee /tmp/ci-vm-tests.log; exit ${PIPESTATUS[0]}

      - name: Tag Claude on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const MAX_CYCLES = 5;
            const pr_number = context.payload.pull_request.number;
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const allComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              per_page: 100,
            });

            const tagged = allComments.filter(c =>
              c.user.type === 'Bot' &&
              c.body?.includes('<!-- claude-auto-tag-vm -->')
            );

            if (tagged.length >= MAX_CYCLES) {
              core.notice(`Cycle limit of ${MAX_CYCLES} reached for PR #${pr_number}. Skipping.`);
              return;
            }

            const logFiles = {
              'Resolve flake inputs': '/tmp/ci-update.log',
              'Run framework VM smoke tests': '/tmp/ci-vm-tests.log',
            };

            const MAX_LOG_CHARS = 6000;
            let logSection = '';
            for (const [stepName, logPath] of Object.entries(logFiles)) {
              try {
                let content = fs.readFileSync(logPath, 'utf8').trim();
                if (content) {
                  if (content.length > MAX_LOG_CHARS) {
                    content = '...(truncated)\n' + content.slice(-MAX_LOG_CHARS);
                  }
                  const safeContent = content.replace(/```/g, '``\\`');
                  logSection += `\n<details>\n<summary>${stepName}</summary>\n\n\`\`\`\n${safeContent}\n\`\`\`\n</details>\n`;
                }
              } catch (err) {
                core.notice(`Unable to read ${logPath}: ${err.message}`);
              }
            }

            const body = `<!-- claude-auto-tag-vm -->\n@claude VM smoke tests failed on this PR. Please investigate the [failed run](${run_url}), identify the root cause, and push a fix.${logSection ? '\n\n### Error Logs\n' + logSection : ''}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body,
            });
