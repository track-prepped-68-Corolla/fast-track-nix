[project]
name = "ft-py"
version = "0.1.0"
description = "Async Python backend + CLI for the ft command (Phase 1: sys + mullet parity with scripts/sys.just and scripts/mullet.just)"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
ft-py = "ft_py.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ft_py"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
