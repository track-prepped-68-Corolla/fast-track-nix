name: CI

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for trufflehog secret scanning.
          # token enables pushing auto-format commits back to the branch.
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ft-home has no committed flake.lock (it is a library input).
      # Materialise a lock for this CI run without committing it.
      - name: Resolve flake inputs
        run: nix flake lock

      # Run treefmt (nixfmt + deadnix) via the flake's formatter output.
      # If any .nix files need formatting, commit them back to the branch.
      # The push is best-effort (|| true): even if it fails, the local
      # commit makes inputs.self point at formatted source, so the format
      # derivation in nix flake check still passes on this run.
      - name: Auto-format (nixfmt + deadnix)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if nix fmt; then
            if ! git diff --quiet; then
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git config user.name "github-actions[bot]"
              git commit -am "style: auto-format"
              git push \
                "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
                "HEAD:${{ github.head_ref || github.ref_name }}" || true
            fi
          else
            echo "::warning::nix fmt returned non-zero; some files may not be formatted"
          fi

      # Runs checks.x86_64-linux.{format,lint} defined in flake.nix.
      # format: treefmt (nixfmt + deadnix)    lint: statix
      # Binary substitutes are fetched from cache.nixos.org.
      - name: nix flake check
        run: nix flake check

      # Trufflehog scans git history for secrets; runs outside the Nix sandbox
      # where the full git tree is available.
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
