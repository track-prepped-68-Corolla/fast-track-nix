name: CI

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ft-home has no committed flake.lock (it is a library input).
      # Materialise a lock for this CI run without committing it.
      - name: Resolve flake inputs
        run: nix flake lock

      # Run nixfmt and deadnix directly via nix shell (bypasses treefmt).
      # If any .nix files need formatting, commit them back so that
      # inputs.self points at formatted source when nix flake check runs.
      - name: Auto-format (nixfmt + deadnix)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell .#nixfmt .#deadnix --command sh -c '
            find . -type f -name "*.nix" -not -path "./.git/*" | sort | xargs -r nixfmt
            find . -type f -name "*.nix" -not -path "./.git/*" | sort | xargs -r deadnix --edit
          '
          if ! git diff --quiet; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -am "style: auto-format"
            git push \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "HEAD:${{ github.head_ref || github.ref_name }}" || true
          fi

      # Runs checks.x86_64-linux.{format,lint} defined in flake.nix.
      - name: nix flake check
        run: nix flake check

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
