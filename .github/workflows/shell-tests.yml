name: Shell Tests

# Manual-dispatch only: the ft shell-recipe suite (shellcheck + bats unit and
# integration) is intentionally kept out of the gating CI, like the VM tests.
on:
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Run shell test suite (shellcheck + bats)
        run: nix build -L .#shell-tests
