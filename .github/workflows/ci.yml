name: CI

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for trufflehog secret scanning.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v14

      # GitHub-native Nix build cache — no Cachix account required.
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Runs checks.x86_64-linux.{format,lint} defined in flake.nix.
      # format: treefmt (nixfmt + deadnix)    lint: statix
      - name: nix flake check
        run: nix flake check

      # Trufflehog scans git history for secrets; runs outside the Nix sandbox
      # where the full git tree is available.
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
