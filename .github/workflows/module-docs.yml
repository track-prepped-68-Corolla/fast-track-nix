name: Generate Module READMEs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Build NixOS module docs
        run: nix build .#module-docs-nixos -o result-nixos

      - name: Build Home module docs
        run: nix build .#module-docs-home -o result-home

      - name: Copy READMEs
        run: |
          cp result-nixos modules/nixos/README.md
          cp result-home modules/home/README.md

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add modules/nixos/README.md modules/home/README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: regenerate module READMEs"
            git push
          fi
