name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@v14

      # GitHub-native Nix build cache — no Cachix account required.
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Materialise a flake.lock if one is not already committed (e.g. on
      # feature branches that predate the lockfile). No-op when flake.lock
      # is already present in the checkout.
      - name: Resolve flake inputs
        run: nix flake lock

      # Auto-format via treefmt (nixfmt + deadnix) and commit if anything changed.
      # A local commit is enough for inputs.self to point at formatted source when
      # nix flake check runs. Pushing would move the PR HEAD to a bot commit that
      # GitHub Actions won't re-trigger CI for.
      - name: Auto-format (treefmt)
        run: |
          nix fmt
          if ! git diff --quiet; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -am "style: auto-format"
          fi

      # Runs checks.x86_64-linux.{format,lint} defined in flake.nix.
      # format: nixfmt + deadnix diff    lint: statix
      - name: nix flake check
        run: nix flake check -L

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
