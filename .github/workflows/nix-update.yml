name: Daily Nix Update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: testing
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Update flake inputs
        run: nix flake update

      - name: Format
        run: nix fmt

      - name: nix flake check
        id: flake-check
        run: nix flake check -L
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f flake.lock
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit"
            exit 0
          fi
          git commit -m "chore: nix flake update $(date -u +%Y-%m-%d)"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if [ "${{ steps.flake-check.outcome }}" == "success" ]; then
            git push origin HEAD:testing
          else
            git push origin HEAD:nix-update-failed --force
          fi

      - name: Trigger CI on testing
        if: steps.flake-check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo ${{ github.repository }} --ref testing

      # Re-fail the job so the CI status reflects the broken check.
      - name: Propagate flake check failure
        if: steps.flake-check.outcome == 'failure'
        run: |
          echo "nix flake check failed; changes pushed to nix-update-failed instead of testing"
          exit 1
